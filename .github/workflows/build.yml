name: FOROUZ manual validation

# Public releases use the permanent signing key held outside this repository.
# This workflow only produces debug validation artifacts; it cannot publish a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned source and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned NDK
        run: |
          sdkmanager --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Build HEV from the pinned submodule
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/
      - name: Restore digest-pinned native dependencies
        run: |
          python3 tools/prepare-xray.py
          python3 tools/prepare-amnezia.py
      - name: Tests, compilation and debug packaging
        working-directory: V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=1 :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin :app:lintPlaystoreDebug :app:assemblePlaystoreDebug
      - name: Upload debug artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FOROUZ-debug-validation
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
